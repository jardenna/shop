<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <title>Rating-fordeling — Skeleton Loading</title>
    <style>
      :root {
        --color-light-gray-30: #ececec;
        --color-light-gray-40: #dcdcdc;
      }

      /* ---- generic skeleton block, matches provided spec ---- */
      .skeleton {
        background: linear-gradient(
          90deg,
          var(--color-light-gray-30) 25%,
          var(--color-light-gray-40) 50%,
          var(--color-light-gray-30) 75%
        );
        background-size: 200% 100%;
        height: 36px;
        width: 100%;
        border-radius: 8px;
        display: flex;
      }

      .distribution {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: 420px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .row-label {
        width: 34px;
        height: 16px;
        border-radius: 4px;
        flex-shrink: 0;
      }

      .row-bar-wrap {
        flex: 1;
        display: flex;
      }

      .row-bar {
        height: 12px;
        border-radius: 999px;
      }

      .row-count {
        width: 18px;
        height: 16px;
        border-radius: 4px;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="distribution">
      <div class="row">
        <div class="row-label skeleton"></div>
        <div class="row-bar-wrap">
          <div class="row-bar skeleton" style="width: 100%"></div>
        </div>
        <div class="row-count skeleton"></div>
      </div>

      <div class="row">
        <div class="row-label skeleton"></div>
        <div class="row-bar-wrap">
          <div class="row-bar skeleton" style="width: 65%"></div>
        </div>
        <div class="row-count skeleton"></div>
      </div>

      <div class="row">
        <div class="row-label skeleton"></div>
        <div class="row-bar-wrap">
          <div class="row-bar skeleton" style="width: 50%"></div>
        </div>
        <div class="row-count skeleton"></div>
      </div>

      <div class="row">
        <div class="row-label skeleton"></div>
        <div class="row-bar-wrap">
          <div class="row-bar skeleton" style="width: 35%"></div>
        </div>
        <div class="row-count skeleton"></div>
      </div>

      <div class="row">
        <div class="row-label skeleton"></div>
        <div class="row-bar-wrap">
          <div class="row-bar skeleton" style="width: 8%"></div>
        </div>
        <div class="row-count skeleton"></div>
      </div>
    </div>
  </body>
</html>
