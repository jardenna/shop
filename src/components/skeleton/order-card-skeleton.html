<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <title>Order Card Skeleton</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        background: #f7f7f5;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        display: flex;
        justify-content: center;
      }

      .order-card {
        width: 100%;
        max-width: 640px;
        background: #ffffff;
        border: 1px solid #e5e5e2;
        border-radius: 12px;
        padding: 24px;
      }

      .skeleton {
        border-radius: 6px;
        background: linear-gradient(
          90deg,
          #e9e9e6 25%,
          #f4f4f2 37%,
          #e9e9e6 63%
        );
        background-size: 400% 100%;
        /* animation: shimmer 1.4s ease-in-out infinite; */
      }

      /* Header row */
      .order-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .order-id {
        width: 120px;
        height: 18px;
      }

      .order-price {
        width: 90px;
        height: 20px;
      }

      /* Status pill */
      .order-status {
        width: 90px;
        height: 28px;
        border-radius: 999px;
        margin-bottom: 20px;
      }

      /* Product row */
      .product-row {
        display: flex;
        gap: 16px;
        margin-bottom: 24px;
      }

      .product-image {
        flex-shrink: 0;
        width: 110px;
        height: 130px;
        border-radius: 8px;
      }

      .product-details {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding-top: 4px;
      }

      .product-title {
        width: 70%;
        height: 16px;
      }

      .product-price {
        width: 35%;
        height: 16px;
      }

      .meta-list {
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .meta-row {
        display: flex;
        gap: 24px;
      }

      .meta-label {
        width: 60px;
        height: 12px;
      }

      .meta-value {
        height: 12px;
      }

      .meta-value.color {
        width: 40px;
      }
      .meta-value.size {
        width: 20px;
      }
      .meta-value.qty {
        width: 15px;
      }

      /* Divider */
      .divider {
        height: 1px;
        background: #e5e5e2;
        margin-bottom: 20px;
      }

      /* Footer row */
      .footer-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .delivery-date {
        width: 220px;
        height: 14px;
      }

      .details-button {
        width: 130px;
        height: 44px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="order-card">
      <div class="order-header">
        <div class="skeleton order-id"></div>
        <div class="skeleton order-price"></div>
      </div>

      <div class="skeleton order-status"></div>

      <div class="product-row">
        <div class="skeleton product-image"></div>
        <div class="product-details">
          <div class="skeleton product-title"></div>
          <div class="skeleton product-price"></div>

          <div class="meta-list">
            <div class="meta-row">
              <div class="skeleton meta-label"></div>
              <div class="skeleton meta-value color"></div>
            </div>
            <div class="meta-row">
              <div class="skeleton meta-label"></div>
              <div class="skeleton meta-value size"></div>
            </div>
            <div class="meta-row">
              <div class="skeleton meta-label"></div>
              <div class="skeleton meta-value qty"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="footer-row">
        <div class="skeleton delivery-date"></div>
        <div class="skeleton details-button"></div>
      </div>
    </div>
  </body>
</html>
