<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <title>Produktlinje — Skeleton Loading</title>
    <style>
      :root {
        --color-light-gray-30: #ececec;
        --color-light-gray-40: #dcdcdc;
      }

      /* ---- generic skeleton block, matches provided spec ---- */
      .skeleton {
        background: linear-gradient(
          90deg,
          var(--color-light-gray-30) 25%,
          var(--color-light-gray-40) 50%,
          var(--color-light-gray-30) 75%
        );
        background-size: 200% 100%;
        height: 36px;
        width: 100%;
        border-radius: 8px;
        display: flex;
      }

      .product-card {
        display: flex;
        gap: 32px;
        max-width: 1000px;
        padding-bottom: 24px;
      }

      .product-thumb {
        width: 224px;
        height: 224px;
        border-radius: 8px;
        flex-shrink: 0;
      }

      .product-body {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .top-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 28px;
        gap: 24px;
      }

      .title-skeleton {
        width: 45%;
        height: 26px;
      }

      .price-skeleton {
        width: 90px;
        height: 22px;
        flex-shrink: 0;
      }

      .meta-lines {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: auto;
      }

      .meta-lines .skeleton {
        height: 16px;
      }

      .meta-color {
        width: 120px;
      }
      .meta-size {
        width: 150px;
      }

      .bottom-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 36px;
      }

      .qty-selector {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .qty-selector .skeleton {
        width: 24px;
        height: 24px;
        border-radius: 6px;
      }

      .qty-selector .qty-value {
        width: 16px;
        height: 18px;
        border-radius: 4px;
      }

      .action-icons {
        display: flex;
        gap: 20px;
      }

      .action-icons .skeleton {
        width: 22px;
        height: 22px;
        border-radius: 6px;
      }

      .divider {
        border: none;
        border-top: 1px solid #eee;
        max-width: 1000px;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <div class="product-card">
      <div class="product-thumb skeleton"></div>

      <div class="product-body">
        <div class="top-row">
          <div class="title-skeleton skeleton"></div>
          <div class="price-skeleton skeleton"></div>
        </div>

        <div class="meta-lines">
          <div class="skeleton meta-color"></div>
          <div class="skeleton meta-size"></div>
        </div>

        <div class="bottom-row">
          <div class="qty-selector">
            <div class="skeleton"></div>
            <div class="skeleton qty-value"></div>
            <div class="skeleton"></div>
          </div>

          <div class="action-icons">
            <div class="skeleton"></div>
            <div class="skeleton"></div>
          </div>
        </div>
      </div>
    </div>

    <hr class="divider" />
  </body>
</html>
