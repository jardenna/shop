<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <title>Statistik-kort — Skeleton Loading</title>
    <style>
      :root {
        --color-light-gray-30: #ececec;
        --color-light-gray-40: #dcdcdc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial,
          sans-serif;
        margin: 0;
        padding: 40px;
        background: #f5f5f5;
      }

      /* ---- generic skeleton block, matches provided spec ---- */
      .skeleton {
        background: linear-gradient(
          90deg,
          var(--color-light-gray-30) 25%,
          var(--color-light-gray-40) 50%,
          var(--color-light-gray-30) 75%
        );
        background-size: 200% 100%;
        height: 36px;
        width: 100%;
        border-radius: 8px;
        display: flex;
        /* animation: skeleton-animation 1.5s infinite linear; */
      }

      @keyframes skeleton-animation {
        0% {
          background-position: 100%;
        }
        100% {
          background-position: -100%;
        }
      }

      .cards {
        display: flex;
        flex-direction: column;
        gap: 28px;
        max-width: 480px;
      }

      .card {
        position: relative;
        background: #fff;
        border-radius: 6px;
        padding: 24px 18px 20px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      }

      .card-main {
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }

      .card-icon {
        width: 44px;
        height: 44px;
        border-radius: 6px;
        flex-shrink: 0;
        margin-top: 8px;
      }

      .card-text {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .card-label {
        width: 140px;
        height: 14px;
        border-radius: 4px;
      }

      .card-value {
        width: 190px;
        height: 28px;
        border-radius: 4px;
      }

      .card-sub {
        width: 260px;
        max-width: 100%;
        height: 14px;
        border-radius: 4px;
      }

      .card-chart {
        width: 44px;
        height: 40px;
        border-radius: 6px;
        flex-shrink: 0;
        margin: 18px 12px 0 0;
      }

      .card-info {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
      }

      /* ---- progress ---- */
      .progress {
        margin-top: 20px;
      }

      .progress-labels {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .progress-labels .skeleton {
        height: 14px;
        border-radius: 4px;
      }

      .progress-label {
        width: 100px;
      }
      .progress-value {
        width: 38px;
      }

      .progress-bar {
        height: 6px;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="cards">
      <!-- Samlet omsætning -->
      <div class="card">
        <div class="card-main">
          <div class="card-icon skeleton"></div>
          <div class="card-text">
            <div class="card-label skeleton"></div>
            <div class="card-value skeleton"></div>
            <div class="card-sub skeleton"></div>
          </div>
          <div class="card-chart skeleton"></div>
        </div>
      </div>

      <!-- Omsætning med målopfyldelse -->
      <div class="card">
        <div class="card-info skeleton"></div>

        <div class="card-main">
          <div class="card-icon skeleton"></div>
          <div class="card-text">
            <div class="card-label skeleton" style="width: 100px"></div>
            <div class="card-value skeleton" style="width: 170px"></div>
            <div class="card-sub skeleton" style="width: 200px"></div>
          </div>
        </div>

        <div class="progress">
          <div class="progress-labels">
            <div class="progress-label skeleton"></div>
            <div class="progress-value skeleton"></div>
          </div>
          <div class="progress-bar skeleton"></div>
        </div>
      </div>
    </div>
  </body>
</html>
