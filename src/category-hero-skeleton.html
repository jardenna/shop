<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <title>Kategori — Skeleton Loading</title>
    <style>
      :root {
        --color-light-gray-30: #ececec;
        --color-light-gray-40: #dcdcdc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial,
          sans-serif;
        margin: 0;
        padding: 0;
        background: #fff;
      }

      /* ---- generic skeleton block, matches provided spec ---- */
      .skeleton {
        background: linear-gradient(
          90deg,
          var(--color-light-gray-30) 25%,
          var(--color-light-gray-40) 50%,
          var(--color-light-gray-30) 75%
        );
        background-size: 200% 100%;
        height: 36px;
        width: 100%;

        display: flex;
      }

      @keyframes skeleton-animation {
        0% {
          background-position: 100%;
        }
        100% {
          background-position: -100%;
        }
      }

      .layout {
        display: flex;
        align-items: stretch;
      }

      /* ---- sidebar ---- */
      .sidebar {
        width: 260px;
        flex-shrink: 0;
        padding: 24px 20px;
        background: #fafafa;
      }

      .sidebar-title {
        height: 22px;
        width: 55%;
        margin: 0 auto 20px;
      }

      .sidebar-divider {
        border: none;
        border-top: 1px solid #e2e2e2;
        margin-bottom: 20px;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 12px;
        margin-bottom: 4px;
      }

      .nav-item.active {
        background: #f0f0f0;
      }

      .nav-icon {
        width: 16px;
        height: 16px;

        flex-shrink: 0;
      }

      .nav-label {
        height: 16px;
        width: 90px;
      }

      /* ---- hero banner ---- */
      .hero {
        flex: 1;
        height: 580px;
      }

      /* ---- toolbar below ---- */
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 32px 20px 292px;
      }

      .view-toggle {
        display: flex;
        gap: 12px;
      }

      .view-toggle .skeleton {
        width: 26px;
        height: 26px;
      }

      .results-label {
        height: 16px;
        width: 170px;
      }

      .filter-btn {
        height: 20px;
        width: 90px;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="sidebar">
        <div class="sidebar-title skeleton"></div>

        <div class="nav-item active">
          <div class="nav-icon skeleton"></div>
          <div class="nav-label skeleton" style="width: 70px"></div>
        </div>
        <div class="nav-item">
          <div class="nav-icon skeleton"></div>
          <div class="nav-label skeleton" style="width: 50px"></div>
        </div>
        <div class="nav-item">
          <div class="nav-icon skeleton"></div>
          <div class="nav-label skeleton" style="width: 55px"></div>
        </div>
        <div class="nav-item">
          <div class="nav-icon skeleton"></div>
          <div class="nav-label skeleton" style="width: 110px"></div>
        </div>
      </div>

      <div class="hero skeleton"></div>
    </div>

    <div class="toolbar">
      <div class="view-toggle">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>

      <div class="results-label skeleton"></div>

      <div class="filter-btn skeleton"></div>
    </div>
  </body>
</html>
