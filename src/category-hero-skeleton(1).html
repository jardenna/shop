<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Kategori — Skeleton Loading</title>
<style>
  :root {
    --color-light-gray-30: #ececec;
    --color-light-gray-40: #dcdcdc;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: #fff;
  }

  /* ---- generic skeleton block, matches provided spec ---- */
  .skeleton {
    background: linear-gradient(
      90deg,
      var(--color-light-gray-30) 25%,
      var(--color-light-gray-40) 50%,
      var(--color-light-gray-30) 75%
    );
    background-size: 200% 100%;
    height: 36px;
    width: 100%;
    border-radius: 8px;
    display: flex;
    animation: skeleton-animation 1.5s infinite linear;
  }

  @keyframes skeleton-animation {
    0% { background-position: 100%; }
    100% { background-position: -100%; }
  }

  .breadcrumb-row {
    display: flex;
    justify-content: flex-end;
    padding: 16px 32px;
  }

  .breadcrumb-skeleton {
    width: 220px;
    height: 16px;
    border-radius: 4px;
  }

  .layout {
    display: flex;
    align-items: stretch;
  }

  /* ---- sidebar ---- */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    padding: 24px 20px;
    background: #fafafa;
  }

  .sidebar-title {
    height: 22px;
    width: 55%;
    margin: 0 auto 20px;
    border-radius: 4px;
  }

  .sidebar-divider {
    border: none;
    border-top: 1px solid #e2e2e2;
    margin-bottom: 20px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 12px;
    margin-bottom: 4px;
    border-radius: 4px;
  }

  .nav-item.active {
    background: #f0f0f0;
  }

  .nav-icon {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .nav-label {
    height: 16px;
    width: 90px;
    border-radius: 4px;
  }

  /* ---- hero banner ---- */
  .hero {
    flex: 1;
    height: 580px;
    border-radius: 0;
  }

  /* ---- toolbar below ---- */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px 20px 292px;
  }

  .view-toggle {
    display: flex;
    gap: 12px;
  }

  .view-toggle .skeleton {
    width: 26px;
    height: 26px;
    border-radius: 6px;
  }

  .results-label {
    height: 16px;
    width: 170px;
    border-radius: 4px;
  }

  .filter-btn {
    height: 20px;
    width: 90px;
    border-radius: 4px;
  }

  /* ---- product grid ---- */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    padding: 0 32px 32px 292px;
  }

  .product-tile {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 0;
  }

  .product-tile .heart-skeleton {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 40px;
    height: 40px;
    border-radius: 8px;
  }
</style>
</head>
<body>

  <div class="breadcrumb-row">
    <div class="breadcrumb-skeleton skeleton"></div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-title skeleton"></div>
      <hr class="sidebar-divider">

      <div class="nav-item active">
        <div class="nav-icon skeleton"></div>
        <div class="nav-label skeleton" style="width:70px;"></div>
      </div>
      <div class="nav-item">
        <div class="nav-icon skeleton"></div>
        <div class="nav-label skeleton" style="width:50px;"></div>
      </div>
      <div class="nav-item">
        <div class="nav-icon skeleton"></div>
        <div class="nav-label skeleton" style="width:55px;"></div>
      </div>
      <div class="nav-item">
        <div class="nav-icon skeleton"></div>
        <div class="nav-label skeleton" style="width:110px;"></div>
      </div>
    </div>

    <div class="hero skeleton"></div>
  </div>

  <div class="toolbar">
    <div class="view-toggle">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>

    <div class="results-label skeleton"></div>

    <div class="filter-btn skeleton"></div>
  </div>

  <div class="product-grid">
    <div class="product-tile skeleton">
      <div class="heart-skeleton skeleton"></div>
    </div>
    <div class="product-tile skeleton">
      <div class="heart-skeleton skeleton"></div>
    </div>
  </div>

</body>
</html>
