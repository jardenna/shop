<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <title>Produktdetalje — Skeleton Loading</title>
    <style>
      :root {
        --color-light-gray-30: #ececec;
        --color-light-gray-40: #dcdcdc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial,
          sans-serif;
        margin: 0;
        padding: 40px;
        background: #fff;
      }

      .product-panel {
        max-width: 480px;
      }

      /* ---- generic skeleton block, matches provided spec ---- */
      .skeleton {
        background: linear-gradient(
          90deg,
          var(--color-light-gray-30) 25%,
          var(--color-light-gray-40) 50%,
          var(--color-light-gray-30) 75%
        );
        background-size: 200% 100%;
        height: 36px;
        width: 100%;
        border-radius: 8px;
        display: flex;
      }

      /* ---- title row ---- */
      .title-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 24px;
        margin-bottom: 20px;
      }

      .title-skeleton {
        width: 65%;
        height: 26px;
      }

      .heart-skeleton {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        flex-shrink: 0;
      }

      /* ---- rating + stock ---- */
      .stars-row {
        display: flex;
        gap: 6px;
        margin-bottom: 20px;
      }

      .star-skeleton {
        width: 20px;
        height: 20px;
        border-radius: 4px;
      }

      .stock-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 24px;
      }

      .stock-icon {
        width: 20px;
        height: 20px;
        border-radius: 50%;
      }

      .stock-label {
        width: 110px;
        height: 16px;
      }

      /* ---- price ---- */
      .price-row {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 32px;
      }

      .price-skeleton {
        width: 150px;
        height: 28px;
      }

      /* ---- rate product ---- */
      .section-label {
        width: 130px;
        height: 16px;
        margin-bottom: 20px;
        border-radius: 4px;
      }

      .divider {
        border: none;
        border-top: 1px solid #eee;
        margin-bottom: 24px;
      }

      .rate-stars {
        display: flex;
        gap: 10px;
        margin-bottom: 32px;
      }

      .rate-stars .star-skeleton {
        width: 26px;
        height: 26px;
      }

      /* ---- color swatches ---- */
      .swatch-label {
        width: 150px;
        height: 16px;
        margin-bottom: 16px;
        border-radius: 4px;
      }

      .swatches {
        display: flex;
        gap: 12px;
        margin-bottom: 32px;
      }

      .swatch {
        width: 100px;
        height: 165px;
        border-radius: 4px;
      }

      /* ---- size selector ---- */
      .size-label {
        width: 170px;
        height: 16px;
        margin-bottom: 16px;
        border-radius: 4px;
      }

      .size-option {
        width: 110px;
        height: 55px;
        border-radius: 4px;
        margin-bottom: 32px;
      }

      /* ---- quantity ---- */
      .qty-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 32px;
      }

      .qty-title {
        width: 60px;
        height: 16px;
      }

      .qty-selector {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .qty-selector .skeleton {
        width: 20px;
        height: 20px;
        border-radius: 4px;
      }

      .qty-value {
        width: 14px;
        height: 16px;
        border-radius: 4px;
      }

      /* ---- add to cart ---- */
      .add-to-cart {
        height: 56px;
        border-radius: 4px;
        margin-bottom: 32px;
      }

      /* ---- accordion ---- */
      .accordion-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 0;
        border-bottom: 1px solid #eee;
      }

      .accordion-title {
        width: 200px;
        height: 16px;
      }

      .accordion-chevron {
        width: 18px;
        height: 18px;
        border-radius: 4px;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="product-panel">
      <div class="title-row">
        <div class="title-skeleton skeleton"></div>
        <div class="heart-skeleton skeleton"></div>
      </div>

      <div class="stars-row">
        <div class="star-skeleton skeleton"></div>
        <div class="star-skeleton skeleton"></div>
        <div class="star-skeleton skeleton"></div>
        <div class="star-skeleton skeleton"></div>
        <div class="star-skeleton skeleton"></div>
      </div>

      <div class="stock-row">
        <div class="stock-icon skeleton"></div>
        <div class="stock-label skeleton"></div>
      </div>

      <div class="price-row">
        <div class="price-skeleton skeleton"></div>
      </div>

      <div class="section-label skeleton"></div>
      <hr class="divider" />

      <div class="rate-stars">
        <div class="star-skeleton skeleton"></div>
        <div class="star-skeleton skeleton"></div>
        <div class="star-skeleton skeleton"></div>
        <div class="star-skeleton skeleton"></div>
        <div class="star-skeleton skeleton"></div>
      </div>

      <div class="swatch-label skeleton"></div>
      <div class="swatches">
        <div class="swatch skeleton"></div>
        <div class="swatch skeleton"></div>
      </div>

      <div class="size-label skeleton"></div>
      <div class="size-option skeleton"></div>

      <div class="qty-row">
        <div class="qty-title skeleton"></div>
        <div class="qty-selector">
          <div class="skeleton"></div>
          <div class="qty-value skeleton"></div>
          <div class="skeleton"></div>
        </div>
      </div>

      <div class="add-to-cart skeleton"></div>
    </div>
  </body>
</html>
